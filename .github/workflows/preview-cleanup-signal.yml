name: Preview cleanup signal
run-name: "Closed preview PR #${{ github.event.pull_request.number }}"

on:
  pull_request_target:
    branches: [main]
    types: [closed]

permissions:
  contents: read

jobs:
  signal:
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    steps:
      - run: echo 'A PR closed; trusted main controller will verify cleanup eligibility.'
